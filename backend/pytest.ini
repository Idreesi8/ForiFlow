[pytest]
minversion = 8.0
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --strict-config
markers =
    scoring: credit scoring and decision policy behaviour
    explain: SHAP explainability behaviour
    ews: early warning system monitoring and alerting
    ml: trained ensemble contract (skipped without model artefacts)
