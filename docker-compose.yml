# ForiFlow demo stack: FastAPI + trained ensemble on :8000, React dashboard
# behind nginx on :3000, PostgreSQL on an internal network. Start with
# ./start.sh, .\start.ps1, or:
#
#   copy .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up -d --build
#
# The dashboard calls /api on its own origin and nginx forwards that to the
# backend container, so nothing depends on the host's CORS configuration.
# Database credentials come from `.env` — never from this file.

services:
  db:
    image: postgres:16.6
    container_name: foriflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - foriflow-pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback so host-side Alembic/copy scripts can reach it
      # without publishing Postgres on the LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    image: foriflow-backend:1.0.0
    container_name: foriflow-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      FORIFLOW_SCORING_ENGINE: ${FORIFLOW_SCORING_ENGINE:-auto}
      FORIFLOW_LOG_LEVEL: ${FORIFLOW_LOG_LEVEL:-INFO}
      FORIFLOW_ENABLE_DOCS: ${FORIFLOW_ENABLE_DOCS:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    volumes:
      # Legacy SQLite file (if any) stays readable for the one-time copy script.
      - foriflow-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # No curl in python:3.11-slim, and adding it just for this would grow the
      # image; the interpreter is already there.
      test:
        - CMD
        - python
        - -c
        - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).status == 200 else 1)
      interval: 15s
      timeout: 10s
      retries: 5
      # Startup loads the ensemble, scaler and SHAP explainer (~34 MB of
      # artefacts) before the first request, which takes tens of seconds.
      start_period: 120s

  frontend:
    build:
      context: ./frontend
    image: foriflow-frontend:1.0.0
    container_name: foriflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      # nginx resolves "backend" on startup, and a dashboard that loads before
      # the model is ready would greet the officer with "API offline".
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Survives "docker compose down"; remove with "docker compose down -v".
  foriflow-data:
    name: foriflow-data
  foriflow-pgdata:
    name: foriflow-pgdata
