# Security headers for the dashboard (installed as
# /etc/nginx/snippets/foriflow-security-headers.conf, included per location).
#
# Content-Security-Policy: scripts, styles, fonts and API calls come from this
# origin only. 'unsafe-inline' for styles is needed by the chart library,
# which sets inline style attributes; no inline script is allowed. Images may
# be data: URIs (the favicon) or blobs (exported charts).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
