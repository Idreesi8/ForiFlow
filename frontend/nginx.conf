# Installed as /etc/nginx/conf.d/default.conf, so this is a server block inside
# the stock nginx http context. nginx runs as the unprivileged "nginx" user
# (see Dockerfile), which is why it listens on 3000 rather than 80.

server {
    listen 3000;
    server_name _;

    # Do not advertise the nginx version in headers or error pages.
    server_tokens off;

    # The largest legitimate request is a statement CSV (2,000,000 characters,
    # about 2 MB as JSON). The API enforces its own 3 MiB limit; this keeps
    # anything much larger from reaching it at all.
    client_max_body_size 4m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    root /usr/share/nginx/html;
    index index.html;

    # Model artefacts make responses chatty rather than large; SHAP payloads
    # compress well.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Serving the API under the same origin as the dashboard means the browser
    # never issues a cross-origin request, so CORS is not involved at all.
    # The API sets its own security headers on these responses.
    location /api/ {
        # Docker's embedded DNS is queried at request time rather than at config
        # load time, so restarting the backend (new container IP) does not leave
        # nginx pinned to a stale address.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $foriflow_backend "http://backend:8000";

        # FastAPI routes are mounted at the root (/score, /explain, /ews,
        # /health), so the /api prefix is stripped before proxying.
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $foriflow_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    # (add_header in a location replaces the inherited set, so each location
    # includes the security headers itself.)
    location /assets/ {
        include /etc/nginx/snippets/foriflow-security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a rebuilt dashboard keeps loading the
    # previous bundle's hashed assets.
    location = /index.html {
        include /etc/nginx/snippets/foriflow-security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # React Router owns the URL space: unknown paths return the SPA shell.
    location / {
        include /etc/nginx/snippets/foriflow-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
