name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (${{ matrix.engine }} engine, PostgreSQL 16)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # surrogate: fixed arithmetic for the decision-policy tests.
        # ml: the committed XGBoost + RF artefacts, loaded with the pinned
        # scikit-learn / xgboost versions they were trained with.
        engine: [surrogate, ml]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foriflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      FORIFLOW_SCORING_ENGINE: ${{ matrix.engine }}
      # Runs the SQLite/PostgreSQL parity tests instead of skipping them.
      FORIFLOW_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/foriflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trained artefacts are present
        if: matrix.engine == 'ml'
        run: python -c "from ml.features import artifacts_available as a; assert a(), 'backend/ml artefacts missing'"
      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
